
name: Build Chess Master APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: unzip -q ChessMaster_GitHub_APK_Build.zip -d project

      - name: Fix Java and Kotlin versions
        run: |
          python3 - <<'PY'
          p = 'project/ChessMasterAndroid/app/build.gradle'
          s = open(p).read()
          s = s.replace(
              '    defaultConfig {',
              """    compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
              defaultConfig {"""
          )
          open(p, 'w').write(s)
          PY

      - name: Build APK
        run: |
          cd project/ChessMasterAndroid
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ChessMaster-debug-apk
          path: project/ChessMasterAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
